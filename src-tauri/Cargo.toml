[workspace]
members = ["crates/tron-core"]

[package]
name = "tron-pocket"
version = "0.1.0"
description = "Tron Pocket - a TRON wallet"
edition = "2021"

[lib]
name = "tron_pocket_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hex = "0.4"
k256 = { version = "0.13", features = ["ecdsa"] }
tron-core = { path = "crates/tron-core" }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
